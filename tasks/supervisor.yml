---
- name: Supervisor configuration
  ansible.builtin.template:
    src: supervisor.j2
    dest: "{{ supervisor_path | format('wifi_login_pages') }}"
    mode: "0644"
  notify: Update wifi_login_pages supervisor program

# runs after the template so an invalid existing config
# is replaced before supervisord tries to load it
- name: Ensure supervisor is running
  ansible.builtin.service:
    name: supervisor
    state: started
    enabled: true
