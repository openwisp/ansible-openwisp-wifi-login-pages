---
# "update" reloads only this program's configuration and restarts it
# only if its configuration changed, other supervisor programs are untouched
- name: Update wifi_login_pages supervisor program
  ansible.builtin.command: supervisorctl update wifi_login_pages
  changed_when: true
  become: true

- name: Restart nginx
  ansible.builtin.service:
    name: nginx
    state: restarted
