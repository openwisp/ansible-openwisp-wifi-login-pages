---
name: Ansible OpenWISP WiFi Login Pages Publish Release

on: # yamllint disable-line rule:truthy
  release:
    types:
      - published

permissions: {}

jobs:
  publish:
    name: Publish the role on Ansible Galaxy
    runs-on: ubuntu-24.04
    concurrency:
      group: galaxy-publish-${{ github.repository }}-${{ github.event.release.id }}
      cancel-in-progress: false

    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Install ansible
        run: pip install ansible

      - name: Update imports on Ansible Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: ansible-galaxy role import openwisp ansible-openwisp-wifi-login-pages --api-key "$GALAXY_API_KEY" --role-name wifi_login_pages
