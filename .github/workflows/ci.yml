---
name: Ansible OpenWISP WiFi Login Pages CI Build

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.distro }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu2404
          - ubuntu2204
          - ubuntu2004
          - debian13
          - debian12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        id: deps
        run: |
          pip install -U pip wheel setuptools
          pip install -r requirements-test.txt
          ansible-galaxy collection install "community.general:>=3.6.0"

      - name: Downgrade ansible on Ubuntu 20.04 LTS
        if: matrix.distro == 'ubuntu2004'
        run: pip install "ansible-core<2.19"

      - name: QA checks
        continue-on-error: true
        run: ./run-qa-checks

      - name: Tests
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: |
          mkdir -p ~/.ansible/roles
          ln -s "$GITHUB_WORKSPACE" ~/.ansible/roles/openwisp.wifi_login_pages
          molecule test
        env:
          ROLE_NAME: openwisp2
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ${{ matrix.distro }}
